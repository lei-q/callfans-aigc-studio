name: Win update launch debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reproduce auto-update launch (cmd.exe /c with quotes)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $p = "$env:RUNNER_TEMP\$name.png"
            $bmp.Save($p); $g.Dispose(); $bmp.Dispose()
          }

          # 模拟自动更新下载目录：文件路径本身和现在一样
          New-Item -ItemType Directory -Force "$env:TEMP\aigc-studio-update" | Out-Null
          $probe = "$env:TEMP\aigc-studio-update\probe.bat"
          "@echo off`r`necho installed > `"$env:TEMP\probe-marker.txt`"" | Set-Content -Encoding ASCII $probe
          Remove-Item "$env:TEMP\probe-marker.txt" -ErrorAction SilentlyContinue

          # 完全照搬 packages/desktop/src/updater.ts 的 launchInstaller 写法
          @'
          const { spawn } = require('node:child_process');
          const file = process.argv[2];
          const target = process.argv[3];
          const cmd = `"${file}" /S & start "" "${target}"`;
          console.log('cmd string:', cmd);
          const p = spawn('cmd.exe', ['/c', cmd], { detached: true, stdio: 'ignore' });
          p.unref();
          '@ | Set-Content -Encoding UTF8 "$env:TEMP\launch.cjs"

          node "$env:TEMP\launch.cjs" $probe "$env:WINDIR\System32\notepad.exe"
          Start-Sleep -Seconds 6

          Shot 'launch-after'
          '--- windows ---'
          Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName) | $($_.MainWindowTitle)" }
          '--- marker ---'
          Get-Content "$env:TEMP\probe-marker.txt" -ErrorAction SilentlyContinue
          '--- notepad ---'
          (Get-Process notepad -ErrorAction SilentlyContinue | Measure-Object).Count

      - name: Show cmd quoting that node produces
        shell: pwsh
        run: |
          # 把 spawn 实际传给 cmd.exe 的命令行打印出来（保持 cmd 存活以便查询）
          @'
          const { spawn } = require('node:child_process');
          const file = process.argv[2];
          const target = process.argv[3];
          const cmd = `"${file}" /S & start "" "${target}"`;
          spawn('cmd.exe', ['/c', `ping -n 15 127.0.0.1 >nul & ${cmd}`], { detached: true, stdio: 'ignore' }).unref();
          '@ | Set-Content -Encoding UTF8 "$env:TEMP\quote.cjs"
          node "$env:TEMP\quote.cjs" "$env:TEMP\aigc-studio-update\probe.bat" "$env:WINDIR\System32\notepad.exe"
          Start-Sleep -Seconds 2
          Get-CimInstance Win32_Process -Filter "Name='cmd.exe'" | ForEach-Object { "CMDLINE: $($_.CommandLine)" }

      - name: Test installer /S --force-run
        shell: pwsh
        run: |
          $u = 'https://github.com/lei-q/callfans-aigc-studio/releases/download/v0.4.20/AIGC-Studio-0.4.20-win-x64.exe'
          Invoke-WebRequest -Uri $u -OutFile "$env:TEMP\aigc.exe"
          # 已有 /S 安装的对照：再用 --force-run 装一次，看是否会自动拉起应用
          $p = Start-Process -FilePath "$env:TEMP\aigc.exe" -ArgumentList '/S','--force-run' -PassThru
          Start-Sleep -Seconds 40
          '--- windows ---'
          Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName) | $($_.MainWindowTitle)" }
          '--- launch-mode ---'
          Get-Content "$env:APPDATA\AIGC Studio\launch-mode.json" -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -like '*AIGC*' } | Select-Object Id, ProcessName | Format-Table -AutoSize
          Stop-Process -Name 'AIGC Studio' -Force -ErrorAction SilentlyContinue

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: launch-screens
          path: ${{ runner.temp }}\*-after.png
          if-no-files-found: warn
